<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday ❤️</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}
#startScreen{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:black;
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
font-size:40px;
text-shadow:0 0 20px pink;
cursor:pointer;
}
body{
overflow:hidden;
background:black;
font-family:'Poppins', sans-serif;
color:white;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
}
.nebula{
position:fixed;
width:500px;
height:500px;
background:radial-gradient(circle, rgba(255,105,180,0.35), transparent 70%);
top:20%;
left:50%;
transform:translateX(-50%);
filter:blur(40px);
z-index:-2;
animation:pulseGlow 6s infinite alternate;
}

@keyframes pulseGlow{
from{
opacity:0.4;
transform:translateX(-50%) scale(1);
}
to{
opacity:0.8;
transform:translateX(-50%) scale(1.3);
}
}
canvas{
position:fixed;
top:0;
left:0;
z-index:-1;
}

.container{
padding:20px;
animation:fade 2s;
max-width:90%;
}

#countdown{
font-size:120px;
font-weight:bold;
text-shadow:0 0 20px white;
}

#birthday{
display:none;
animation:fade 2s;
}


#birthday h1{
font-size:50px;
margin-bottom:20px;
text-shadow:0 0 15px pink;
font-family:'Great Vibes', cursive;
letter-spacing:2px;
}

button{
padding:15px 35px;
font-size:20px;
border:none;
border-radius:30px;
background:pink;
color:white;
cursor:pointer;
transition:0.3s;
box-shadow:0 0 15px pink;
}

button:hover{
transform:scale(1.1);
}

#letter{
display:none;
margin-top:30px;
animation:fade 1.5s;
}

.message{
font-size:22px;
line-height:1.8;
background:rgba(255,255,255,0.08);
padding:25px;
border-radius:20px;
backdrop-filter:blur(5px);
}
.envelope-container{
margin-top:30px;
cursor:pointer;
animation:fade 2s;
}

.envelope{
position:relative;
width:260px;
height:180px;
background:#ff4f81;
margin:auto;
border-radius:10px;
overflow:hidden;
box-shadow:0 0 25px rgba(255,105,180,0.6);
}

.flap{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
background:#ff7aa2;
clip-path:polygon(0 0, 50% 55%, 100% 0);
transform-origin:top;
transition:1s;
z-index:2;
}

.letter-inside{
position:absolute;
width:90%;
height:85%;
background:white;
color:black;
left:5%;
top:8%;
border-radius:10px;
display:flex;
justify-content:center;
align-items:center;
font-size:40px;
transition:1s;
z-index:1;
}

.envelope.open .flap{
transform:rotateX(180deg);
}

.envelope.open .letter-inside{
transform:translateY(-120px);
}

.tap-text{
margin-top:15px;
font-size:22px;
color:pink;
text-shadow:0 0 10px pink;
}
.photos{
margin-top:25px;
display:flex;
gap:20px;
justify-content:center;
flex-wrap:wrap;
}

.photos img{
width:240px;
height:320px;
object-fit:cover;
border-radius:20px;
box-shadow:0 0 20px rgba(255,255,255,0.4);
transition:0.5s;
opacity:0;
}

.photos img:hover{
transform:scale(1.05);
}

.final{
margin-top:25px;
font-size:24px;
color:pink;
text-shadow:0 0 10px pink;
}
@keyframes floatUp{

0%{
transform:translateY(0);
opacity:1;
}

100%{
transform:translateY(-120vh);
opacity:0;
}

}
@keyframes revealPhoto{

from{
opacity:0;
transform:translateY(30px) scale(0.9);
}

to{
opacity:1;
transform:translateY(0) scale(1);
}

}
#heartGallery{
display:none;
margin-top:35px;
animation:fade 2s;
}

#heartGallery h2{
font-family:'Great Vibes', cursive;
font-size:42px;
color:pink;
text-shadow:0 0 15px pink;
margin-bottom:20px;
}

.heart{
position:relative;
width:300px;
height:270px;
margin:0 auto;
}

.heart img{
position:absolute;
width:80px;
height:80px;
object-fit:cover;
border-radius:15px;
box-shadow:0 0 15px rgba(255,255,255,0.6);
}

.heart img:nth-child(1){left:110px;top:0;}
.heart img:nth-child(2){left:55px;top:35px;}
.heart img:nth-child(3){left:165px;top:35px;}
.heart img:nth-child(4){left:25px;top:95px;}
.heart img:nth-child(5){left:195px;top:95px;}
.heart img:nth-child(6){left:55px;top:155px;}
.heart img:nth-child(7){left:165px;top:155px;}
.heart img:nth-child(8){left:110px;top:210px;}
.heart img:nth-child(9){left:110px;top:85px;}

.sparkle{
position:fixed;
pointer-events:none;
font-size:18px;
z-index:999;
animation:sparkleFade 1s forwards;
}

@keyframes sparkleFade{
from{
opacity:1;
transform:scale(1);
}
to{
opacity:0;
transform:scale(0) translateY(-30px);
}
}
@keyframes fade{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:translateY(0);
}
}

</style>
</head>

<body>
<audio id="bgMusic" loop>
<source src="music.mp3" type="audio/mp3">
</audio>

<div id="startScreen">
<h1>Tap To Open ❤️</h1>
</div>
<canvas id="stars"></canvas>
<div class="nebula"></div>
<div class="container">

<h1 id="countdown">3</h1>

<div id="birthday">

<h1>Happy Birthday My Love ❤️</h1>

<div class="envelope-container" onclick="openLetter()">

<div class="envelope">

<div class="flap"></div>

<div class="letter-inside">
💌
</div>

</div>

<p class="tap-text">Tap The Letter ❤️</p>

</div>

<div id="letter">

<div class="message">
<p id="typewriter"></p>
</div>

<div class="photos">

<img src="photo1.jpg">
<img src="photo2.jpg">
<img src="photo3.jpg">

</div>

<div id="heartGallery">

<h2>Our Little Memories ❤️</h2>

<div class="heart">
<img src="photo1.jpg">
<img src="photo2.jpg">
<img src="photo3.jpg">
<img src="photo1.jpg">
<img src="photo2.jpg">
<img src="photo3.jpg">
<img src="photo1.jpg">
<img src="photo2.jpg">
<img src="photo3.jpg">
</div>

<p class="final">
Distance never stopped me from loving you ❤️
</p>

</div>
</div>

</div>

</div>

<script>

// countdown
const startScreen = document.getElementById("startScreen");
const music = document.getElementById("bgMusic");

startScreen.addEventListener("click", () => {

music.play();

startScreen.style.display = "none";

});
let count = 3;

const countdown = document.getElementById("countdown");
const birthday = document.getElementById("birthday");

let interval = setInterval(() => {

count--;

if(count > 0){
countdown.innerText = count;
}else{

clearInterval(interval);

countdown.style.display = "none";
birthday.style.display = "block";

}

},1000);


const text = `Happy Birthday to the most special person in my life ❤️

Even though we are far apart,
you always make my days brighter.

Thank you for loving me,
staying with me,
and making me feel happy every single day.

I wish I could celebrate beside you today.

But until that day comes,
please remember that my heart is always with you.

I love you so much ❤️`;

let index = 0;

function typeWriter(){

if(index < text.length){

document.getElementById("typewriter").innerHTML += text.charAt(index);

index++;

setTimeout(typeWriter,45);

}else{

showPhotos();

}

}
function showPhotos(){

const photos = document.querySelectorAll(".photos img");

photos.forEach((photo,i)=>{

setTimeout(()=>{

photo.style.opacity = "1";
photo.style.animation = "revealPhoto 1.5s forwards";

}, i * 1500);

});

setTimeout(()=>{

document.getElementById("heartGallery").style.display = "block";

}, photos.length * 1500 + 1500);

}
function openLetter(){

const envelope = document.querySelector(".envelope");

envelope.classList.add("open");

setTimeout(() => {

document.getElementById("letter").style.display = "block";
typeWriter();
document.querySelector(".envelope-container").style.display = "none";

},1200);

}


// stars background

const canvas = document.getElementById("stars");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let stars = [];

for(let i = 0; i < 250; i++){

stars.push({
x: Math.random() * canvas.width,
y: Math.random() * canvas.height,
size: Math.random() * 2,
speed: Math.random() * 0.5 + 0.2
});

}

function animate(){

ctx.clearRect(0,0,canvas.width,canvas.height);

ctx.fillStyle = "white";

stars.forEach(star => {

ctx.beginPath();
ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
ctx.fill();

star.y += star.speed;

if(star.y > canvas.height){
star.y = 0;
star.x = Math.random() * canvas.width;
}

});

requestAnimationFrame(animate);

}

animate();
document.addEventListener("mousemove", (e)=>{

let sparkle = document.createElement("div");

sparkle.className = "sparkle";
sparkle.innerHTML = "✨";
sparkle.style.left = e.clientX + "px";
sparkle.style.top = e.clientY + "px";

document.body.appendChild(sparkle);

setTimeout(()=>{
sparkle.remove();
},1000);

});
setInterval(() => {

let heart = document.createElement("div");

heart.innerHTML = "❤️";

heart.style.position = "fixed";
heart.style.left = Math.random() * window.innerWidth + "px";
heart.style.top = "100%";
heart.style.fontSize = (Math.random() * 20 + 20) + "px";
heart.style.animation = "floatUp 6s linear";
heart.style.zIndex = "999";

document.body.appendChild(heart);

setTimeout(() => {
heart.remove();
},6000);

},500);
</script>

</body>
</html>
